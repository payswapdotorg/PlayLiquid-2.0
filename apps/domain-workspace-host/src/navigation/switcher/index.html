<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Workspace switcher — PlayLiquid</title>
    <link rel="stylesheet" href="./switcher.css" />
  </head>
  <body>
    <div class="switcher" role="toolbar" aria-label="Workspace navigation" data-testid="workspace-switch-control">
      <button
        type="button"
        id="btn-prev"
        aria-label="Previous workspace"
        title="Previous workspace — ZCode"
        data-testid="switcher-previous"
      >
        <span aria-hidden="true">&laquo;</span>
      </button>
      <button
        type="button"
        id="btn-next"
        aria-label="Next workspace"
        title="Next workspace — Domain Workspace"
        data-testid="switcher-next"
      >
        <span aria-hidden="true">&raquo;</span>
      </button>
      <span class="pip" aria-hidden="true"><span class="pip-thumb" id="pip-thumb"></span></span>
    </div>
    <script src="./switcher.js"></script>
  </body>
</html>
