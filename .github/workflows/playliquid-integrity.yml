name: playliquid-integrity

# Public, machine-checked proof that the fork stays additions-only:
# zero upstream files modified / deleted / renamed vs the verified baseline.
# Runs on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upstream integrity gate (additions-only rule)
        run: |
          node apps/domain-workspace-host/scripts/verify-upstream-integrity.mjs

      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-report
          path: docs/qa/integrity-report.json
          if-no-files-found: ignore
